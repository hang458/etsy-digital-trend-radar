name: Etsy Digital Trend Radar

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: etsy-digital-radar
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect public Etsy digital listing signals
        env:
          ETSY_KEYSTRING: ${{ secrets.ETSY_KEYSTRING }}
          ETSY_SHARED_SECRET: ${{ secrets.ETSY_SHARED_SECRET }}
        run: python radar.py
      - name: Save rolling research state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state/radar_state.json site/data
          git diff --cached --quiet || git commit -m "Refresh Etsy digital trend snapshot"
          git push
      - name: Explain why the dashboard is not being published
        if: github.repository_visibility != 'public'
        run: echo "GitHub Pages deployment is skipped because this repository is private. Collection and snapshot updates still complete."
      - uses: actions/configure-pages@v5
        if: github.repository_visibility == 'public'
      - uses: actions/upload-pages-artifact@v3
        if: github.repository_visibility == 'public'
        with:
          path: site
      - uses: actions/deploy-pages@v4
        if: github.repository_visibility == 'public'
